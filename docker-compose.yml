version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: edu_center_db
      POSTGRES_USER: edu_user
      POSTGRES_PASSWORD: superpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=edu_center_db
      - DB_USER=edu_user
      - DB_PASS=superpassword123

volumes:
  postgres_data: